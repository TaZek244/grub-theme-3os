# rEFInd — chỉ 3 hệ điều hành, xếp hàng ngang, không có menu phụ/công cụ
timeout 8
use_nvram false
resolution 1920 1080

# Giao diện
banner themes/triboot/banner.png
banner_scale fillscreen
big_icon_size 192
small_icon_size 48
selection_big   themes/triboot/selection_big.png
selection_small themes/triboot/selection_small.png
# Ẩn gợi ý, mũi tên, huy hiệu ổ đĩa và trình sửa tham số (F2/Insert)
hideui label,hints,arrows,badges,editor,singleuser,safemode,hwtest
# Không hiện hàng công cụ. rEFInd 0.14.2 chỉ ghi đè từng ô của danh sách mặc định,
# nên lấp mọi ô bằng "netboot" (cần ipxe.efi — máy không có) để hàng công cụ trống
showtools netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot,netboot

# Chỉ dùng 3 mục khai báo bên dưới, không tự dò thêm
scanfor manual
default_selection "Arch Linux"

# --- Arch Linux: SSD sda (sda1 = /boot của Arch) ---
menuentry "Arch Linux" {
    icon    /EFI/refind/themes/triboot/icons/arch.png
    volume  124A725E-8A92-4D60-ACCD-91697F6E1B76
    loader  /vmlinuz-linux
    initrd  /initramfs-linux.img
    options "root=UUID=8006d6ff-4672-4328-a7b4-86ce5b21ba88 rw loglevel=3 quiet"
}

# --- Windows 11: ESP trên NVMe (nvme0n1p1) ---
menuentry "Windows 11" {
    icon    /EFI/refind/themes/triboot/icons/windows.png
    volume  2ECC4D3C-983C-4039-8914-553998470895
    loader  /EFI/Microsoft/Boot/bootmgfw.efi
}

# --- Ubuntu: chạy shim/GRUB của Ubuntu trên ESP NVMe (giống mục "ubuntu" của firmware) ---
menuentry "Ubuntu" {
    icon    /EFI/refind/themes/triboot/icons/ubuntu.png
    volume  2ECC4D3C-983C-4039-8914-553998470895
    loader  /EFI/ubuntu/shimx64.efi
}
